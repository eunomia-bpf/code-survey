name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Smoke-test upgraded dependencies
        run: |
          python - <<'PY'
          import git
          import tornado
          import urllib3
          import requests
          import certifi
          import idna
          import jinja2
          import pygments
          import google.protobuf
          import pyarrow
          print("Pinned dependency imports passed")
          PY
